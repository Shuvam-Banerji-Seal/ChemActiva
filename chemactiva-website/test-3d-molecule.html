<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Molecule Test</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #0a1208;
            color: white;
            font-family: Arial, sans-serif;
        }
        
        #test-container {
            width: 400px;
            height: 400px;
            border: 2px solid #32df6e;
            margin: 20px auto;
            position: relative;
        }
        
        #test-container canvas {
            border-radius: 10px;
        }
        
        .test-info {
            text-align: center;
            margin: 20px;
        }
        
        .test-button {
            background: #32df6e;
            color: #0a1208;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        
        .test-button:hover {
            background: #4eff7a;
        }
    </style>
</head>
<body>
    <div class="test-info">
        <h1>3D Cellulose Molecule Test</h1>
        <p>This page tests the 3D molecule rendering independently</p>
        <button class="test-button" onclick="testMolecule()">Test Molecule</button>
        <button class="test-button" onclick="testFallback()">Test Fallback</button>
    </div>
    
    <div id="test-container"></div>
    
    <div class="test-info">
        <p id="status">Ready to test...</p>
    </div>

    <script type="module">
        import * as THREE from '/node_modules/three/build/three.module.js';
        import { OrbitControls } from '/node_modules/three/examples/jsm/controls/OrbitControls.js';
        import { GLTFLoader } from '/node_modules/three/examples/jsm/loaders/GLTFLoader.js';

        let scene, camera, renderer, controls, molecule;
        let animationId;

        function initScene() {
            const container = document.getElementById('test-container');
            
            // Scene setup
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(50, 1, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            
            renderer.setSize(400, 400);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setClearColor(0x000000, 0);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            
            container.appendChild(renderer.domElement);
            
            // Camera positioning
            camera.position.set(0, 1.8, 7);
            camera.lookAt(0, 0.8, 0);
            
            // Controls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.target.set(0, 0.8, 0);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 4;
            controls.maxDistance = 15;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.3;
            controls.enablePan = false;
            
            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.2);
            directionalLight.position.set(4, 8, 6);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 1024;
            directionalLight.shadow.mapSize.height = 1024;
            scene.add(directionalLight);
            
            const hemisphereLight = new THREE.HemisphereLight(0xffffbb, 0x080820, 0.4);
            scene.add(hemisphereLight);
            
            // Ground plane
            const groundGeometry = new THREE.PlaneGeometry(20, 20);
            const groundMaterial = new THREE.ShadowMaterial({ opacity: 0.25 });
            const groundPlane = new THREE.Mesh(groundGeometry, groundMaterial);
            groundPlane.rotation.x = -Math.PI / 2;
            groundPlane.position.y = -0.05;
            groundPlane.receiveShadow = true;
            scene.add(groundPlane);
            
            document.getElementById('status').textContent = 'Scene initialized. Ready to load molecule.';
        }

        function loadMolecule() {
            const loader = new GLTFLoader();
            
            loader.load('/assets/models/cellulose.glb', (gltf) => {
                if (molecule) scene.remove(molecule);
                
                molecule = gltf.scene;
                molecule.scale.set(0.4, 0.4, 0.4);
                molecule.position.y = 0.7;
                
                molecule.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                        child.material.metalness = 0.2;
                        child.material.roughness = 0.7;
                    }
                });
                
                scene.add(molecule);
                document.getElementById('status').textContent = 'GLTF molecule loaded successfully!';
                
            }, undefined, (error) => {
                console.error('Error loading GLTF:', error);
                loadFallbackMolecule();
            });
        }

        function loadFallbackMolecule() {
            if (molecule) scene.remove(molecule);
            
            const geometry = new THREE.SphereGeometry(0.6, 32, 16);
            const material = new THREE.MeshStandardMaterial({ color: 0x255F38 });
            molecule = new THREE.Mesh(geometry, material);
            molecule.position.y = 0.7;
            molecule.castShadow = true;
            scene.add(molecule);
            
            document.getElementById('status').textContent = 'Fallback sphere molecule loaded.';
        }

        function animate() {
            animationId = requestAnimationFrame(animate);
            
            if (controls) controls.update();
            
            if (molecule && molecule.parent) {
                molecule.rotation.x += 0.001;
                molecule.rotation.y -= 0.004;
            }
            
            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }

        function startAnimation() {
            if (animationId) cancelAnimationFrame(animationId);
            animate();
        }

        // Global functions for buttons
        window.testMolecule = function() {
            if (!scene) initScene();
            loadMolecule();
            startAnimation();
        };

        window.testFallback = function() {
            if (!scene) initScene();
            loadFallbackMolecule();
            startAnimation();
        };

        // Auto-initialize
        initScene();
        startAnimation();
    </script>
</body>
</html>
