<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Blog – ChemActiva</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Lato:wght@300;400;700&family=Stix+Two+Text:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/typography.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/sections.css">
    <link rel="stylesheet" href="/css/articles.css">
    <link rel="stylesheet" href="/css/modern-article-cards.css">
    <link rel="stylesheet" href="/css/expandable-text.css">
    <link rel="stylesheet" href="/css/mobile-fixes.css">
    <link rel="icon" type="image/png" href="/assets/images/logo-small_size.png">
</head>
<body>
    <div id="main-container">
        <header id="navbar">
            <div class="container">
                <a href="/index.html" class="logo">
                    <img src="/assets/images/logo.png" alt="ChemActiva Logo" id="navbar-logo-img">
                </a>
                <nav class="nav-links">
                    <a href="/index.html#about-us">About</a>
                    <a href="/index.html#our-journey">Journey</a>
                    <a href="/products.html">Products</a>
                    <a href="/innovation.html">Innovation</a>
                    <a href="/blog.html" class="active-nav-link">Blog</a>
                    <a href="/index.html#our-team">Team</a>
                    <a href="/index.html#contact">Contact</a>
                    <div class="theme-switcher theme-switcher-mobile">
                        <input type="checkbox" id="theme-toggle-mobile" class="theme-toggle-checkbox">
                        <label for="theme-toggle-mobile" class="theme-toggle-label">
                            <span class="toggle-ball">
                                <span class="icon sun-icon">☀️</span>
                                <span class="icon moon-icon">🌙</span>
                            </span>
                        </label>
                    </div>
                </nav>
                <div class="controls-container">
                    <div class="theme-switcher" id="theme-switcher-desktop">
                        <input type="checkbox" id="theme-toggle" class="theme-toggle-checkbox">
                        <label for="theme-toggle" class="theme-toggle-label">
                            <span class="toggle-ball">
                                <span class="icon sun-icon">☀️</span>
                                <span class="icon moon-icon">🌙</span>
                            </span>
                        </label>
                    </div>
                    <button id="hamburger-menu" aria-label="Open menu">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>
                </div>
            </div>
        </header>

        <main>
            <section id="blog-listing" class="content-section article-listing-section">
                <div class="container">
                    <h2>Our Blog</h2>
                    <p class="page-subtitle">Insights, discoveries, and stories from our journey in sustainable nanocellulose innovation</p>
                    <div class="article-grid" id="blog-grid">
                        <p class="placeholder-text">Loading blog posts...</p>
                    </div>
                </div>
            </section>
        </main>

        <footer id="footer">
            <div class="container">
                <p>© <span id="current-year"></span> ChemActiva Innovations Pvt Ltd. All rights reserved.</p>
                <p>Pioneering Sustainable Nano Cellulose</p>
            </div>
        </footer>
    </div>

    <script type="module">
        import ArticleManager from './/js/ArticleManager.js';
        import UIAnimations from './/js/UIAnimations.js';
        import ModernCursorEffects from './/js/ModernCursorEffects.js';
        import ModernThemeManager from './/js/ModernThemeManager.js';
        
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize modern theme manager first for proper dark mode support
            const modernThemeManager = new ModernThemeManager();
            
            // Initialize UI animations
            const uiAnimations = new UIAnimations();
            uiAnimations.init();

            const blogManager = new ArticleManager(
                '#blog-grid',
                '/blog.jsonl',
                'blog',
                'single-article.html'
            );
            blogManager.loadAndDisplayArticles();
            
            // Initialize modern cursor effects for enhanced interactivity
            const modernCursorEffects = new ModernCursorEffects();
            console.log('Modern cursor effects initialized for blog page');

            const currentYearSpan = document.getElementById('current-year');
            if (currentYearSpan) currentYearSpan.textContent = new Date().getFullYear();
        });
    </script>
</body>
</html>
